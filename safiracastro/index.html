<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF9FB">
<title>Posso postar agora? · Dra. Safira Castro</title>
<meta name="description" content="A hora certa de postar da Dra. Safira Castro, com o público real do Instagram, em tempo real.">
<meta property="og:title" content="Posso postar agora?">
<meta property="og:description" content="Dra. Safira Castro · Proctologia · @drasafiracastro">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9FB;--card:#FFFFFF;--ink:#2C2127;--ink2:#6E5B65;--mute:#AC97A2;--line:#F4E2E9;
  --rose:#D14F7B;--rose-d:#A73A5F;--blush:#FDEEF3;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding:18px 16px 20px;}
.wrap{max-width:480px;margin:0 auto;}

header{text-align:center;margin-bottom:12px;}
.ey{font-size:10px;letter-spacing:3.2px;text-transform:uppercase;color:var(--rose);font-weight:600;}
.nm{font-family:'Cormorant',serif;font-weight:400;font-size:31px;line-height:1.05;margin:4px 0 2px;}
.nm em{font-style:italic;color:var(--rose);}
.sp{font-size:10px;letter-spacing:4.5px;text-transform:uppercase;color:var(--ink2);}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 16px 14px;box-shadow:0 20px 44px -30px rgba(209,79,123,.45);}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.when{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;}
.when .dot{width:6px;height:6px;border-radius:50%;background:var(--rose);animation:breathe 2.4s ease-in-out infinite;}
.when.scrub .dot{background:var(--ink);animation:none;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.25}}
.acts{display:flex;gap:6px;align-items:center;}
.back{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-family:inherit;display:none;}
.back.on{display:inline-block;}
.best{font-size:11px;font-weight:700;color:#fff;background:var(--rose);border:0;border-radius:999px;padding:6px 11px;cursor:pointer;font-family:inherit;box-shadow:0 6px 14px -8px rgba(209,79,123,.8);}
.best.on{background:var(--ink);}
.mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px;}
.verb{font-family:'Cormorant',serif;font-style:italic;font-weight:500;font-size:44px;line-height:1;letter-spacing:-.5px;transition:color .25s;}
.verb.go{color:var(--rose);}
.verb.hold{color:#C49AAC;}
.lvl{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1px;border-radius:6px;padding:3px 7px;margin-left:8px;vertical-align:middle;}
.l3{background:var(--rose);color:#fff;}.l2{background:#FCE0EA;color:var(--rose-d);}.l1{background:#F7ECF1;color:#8E7480;}.l0{background:transparent;color:var(--mute);border:1px dashed #EBCAD6;}
.pct{text-align:right;line-height:1;}
.pct b{font-family:'Cormorant',serif;font-weight:500;font-size:32px;}
.pct small{font-size:14px;}
.pct span{display:block;font-size:10px;color:var(--mute);margin-top:3px;}

.chart{margin-top:10px;position:relative;}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:2px;}

.days{display:flex;gap:5px;margin-top:12px;}
.days button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 0;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;position:relative;}
.days button.on{background:var(--rose);border-color:var(--rose);color:#fff;}
.days button.today::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--rose);}
.days button.on.today::after{background:#fff;}

.pill{margin-top:10px;background:var(--blush);border-radius:14px;padding:9px 12px;font-size:12.5px;color:var(--rose-d);min-height:38px;line-height:1.45;}
.pill b{font-weight:700;}
.hint{text-align:center;font-size:10.5px;color:var(--mute);margin-top:7px;}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;align-items:stretch;}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 6px;display:flex;flex-direction:column;}
.bt{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:2px;}
.it{flex:1;display:flex;align-items:center;gap:9px;min-height:50px;border-bottom:1px solid var(--line);}
.it:last-child{border-bottom:0;}
.it .tx{flex:1;min-width:0;line-height:1.15;}
.it .tx b{display:block;font-size:12.5px;font-weight:700;color:var(--ink);}
.it .tx span{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px;}
.top{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font-family:inherit;text-align:left;cursor:pointer;padding:0;}
.top .rk{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--blush);color:var(--rose);}
.top:first-of-type .rk{background:var(--rose);color:#fff;}
.top .ar{color:#D9B3C2;font-size:16px;line-height:1;}
.st .nb{font-family:'Cormorant',serif;font-weight:500;font-size:24px;line-height:1;color:var(--rose);min-width:46px;}
.st .nb.k{color:var(--ink);font-size:21px;}
.ages{flex:2;display:flex;flex-direction:column;padding:8px 0 6px;}
.ah{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.ah b{font-size:12.5px;font-weight:700;}
.ah span{font-size:9.5px;color:var(--ink2);}
.acs{display:flex;align-items:flex-end;gap:5px;margin-top:auto;padding-top:6px;}
.ac{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.bw{height:52px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.ac i{display:block;flex:0 0 auto;width:100%;border-radius:6px 6px 2px 2px;background:#F2B2C7;}
.ac.hi i{background:var(--rose);}
.av{font-size:8.5px;font-weight:700;color:var(--ink2);margin-bottom:2px;}
.ac.hi .av{color:var(--rose);}
.al{font-size:8px;white-space:nowrap;letter-spacing:-.2px;color:var(--mute);margin-top:3px;}
.it .tx .bar{display:flex;height:3px;border-radius:999px;overflow:hidden;margin-top:4px;background:#F8D2DF;}
.bar i{display:block;height:100%;background:var(--rose);}
footer{margin-top:8px;text-align:center;font-size:10.5px;color:var(--mute);line-height:1.7;}
footer .sig{font-family:'Cormorant',serif;font-style:italic;font-size:13px;color:var(--ink2);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="ey">Posso postar agora?</div>
    <div class="nm">Dra. Safira <em>Castro</em></div>
    <div class="sp">Proctologia</div>
  </header>

  <div class="card">
    <div class="row">
      <div class="when" id="when"><span class="dot"></span><span id="whenT">--</span></div>
      <div class="acts"><button class="back" id="back">agora</button><button class="best" id="best">melhor horário ›</button></div>
    </div>
    <div class="mid">
      <div><span class="verb" id="verb">...</span><span class="lvl" id="lvl"></span></div>
      <div class="pct"><b id="pct">0</b><small>%</small><span>do pico da semana</span></div>
    </div>
    <div class="chart">
      <svg id="svg" viewBox="0 0 340 118" aria-label="Gente online ao longo do dia. Arrasta pra ver cada horário."></svg>
      <div class="axis"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>
    </div>
    <div class="days" id="days"></div>
    <div class="pill" id="pill"></div>
    <div class="hint">arrasta o dedo no gráfico pra ver o horário exato</div>
  </div>

  <div class="duo">
    <div class="box">
      <div class="bt">Top horários</div>
      <button class="it top" data-d="0"><span class="rk">1</span><span class="tx"><b>Domingo</b><span>18h às 21h</span></span><span class="ar">›</span></button>
      <button class="it top" data-d="1"><span class="rk">2</span><span class="tx"><b>Segunda</b><span>18h às 21h</span></span><span class="ar">›</span></button>
      <button class="it top" data-d="2"><span class="rk">3</span><span class="tx"><b>Terça</b><span>18h às 21h</span></span><span class="ar">›</span></button>
    </div>
    <div class="box">
      <div class="bt">Teu público</div>
      <div class="it st"><span class="nb">81%</span><span class="tx"><b>mulheres</b><span class="bar"><i style="width:81%"></i></span></span></div>
      <div class="ages"><div class="ah"><b>Idade</b></div><div class="acs"><div class="ac"><span class="bw"><span class="av">1%</span><i style="height:4%"></i></span><span class="al">18-24</span></div><div class="ac"><span class="bw"><span class="av">14%</span><i style="height:40%"></i></span><span class="al">25-34</span></div><div class="ac"><span class="bw"><span class="av">22%</span><i style="height:62%"></i></span><span class="al">35-44</span></div><div class="ac hi"><span class="bw"><span class="av">24%</span><i style="height:70%"></i></span><span class="al">45-54</span></div><div class="ac"><span class="bw"><span class="av">21%</span><i style="height:60%"></i></span><span class="al">55-64</span></div><div class="ac"><span class="bw"><span class="av">18%</span><i style="height:51%"></i></span><span class="al">65+</span></div></div></div>
    </div>
  </div>

  <footer>
    <div class="sig">Renan Horisawa | pulsar.science</div>
  </footer>

</div>

<script>
const TZ='America/Sao_Paulo';
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DA=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const ORDER=[1,2,3,4,5,6,0];

/* atividade dos seguidores (Insights, blocos de 3h a partir de 0h) */
const B=[750,350,1400,2200,2350,2500,2640,2290], PEAK=2640;
const MUL=[1,.98,.97,.93,.93,.92,.9];
const GOLD=[0,1,2];
const BEST={0:[[18,21]],1:[[18,21]],2:[[18,21]],3:[[18,21]],4:[[18,21]],5:[[12,14],[18,20]],6:[[12,14],[18,20]]};

function base(h){
  h=((h%24)+24)%24;
  const p=(h-1.5)/3; const i=Math.floor(p), t=p-i;
  const a=B[(i+8)%8], b=B[(i+9)%8];
  return a+(b-a)*(1-Math.cos(Math.PI*t))/2;
}
function score(d,h){
  let s=base(h)/PEAK*100*MUL[d];
  if((d===5||d===6)&&h>=20) s*=1-.14*Math.min(1,(h-20)/2);
  return Math.round(s);
}
function tier(d,h){
  if(GOLD.includes(d)&&h>=18&&h<21) return 3;
  const s=score(d,h); return s>=75?2:s>=40?1:0;
}
const LAB={3:'OURO',2:'BOA',1:'FRACA',0:'DORMINDO'};

function now(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g('weekday')],h:+g('hour')%24,m:+g('minute')};
}
const hm=x=>{let H=Math.floor(x),M=Math.round((x-H)*60);if(M===60){H++;M=0;}return `${H%24}h${String(M).padStart(2,'0')}`;};
const range=r=>`${r[0]}h às ${r[1]}h`;
function dur(min){min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;return h?`${h}h${String(m).padStart(2,'0')}`:`${m}min`;}

/* proxima janela de ouro a partir de agora (minutos) */
function nextGold(n){
  const t0=n.h*60+n.m;
  for(let k=0;k<8;k++){
    const d=(n.d+k)%7; if(!GOLD.includes(d)) continue;
    const start=k*1440+18*60;
    if(start>t0) return {d,k,mins:start-t0};
  }
}

/* estado */
let day=now().d, sel=null, bestMode=false; // sel = hora escolhida (null = agora)

const W=340,H=118,TOP=26,BOT=108;
const X=h=>h/24*W, Y=s=>BOT-(s/100)*(BOT-TOP);

function draw(){
  const n=now(), live=sel===null&&day===n.d;
  const hf=live?n.h+n.m/60:(sel!==null?sel:18.5);
  let pts=[];for(let i=0;i<=96;i++){const h=i/4;pts.push(`${X(h).toFixed(1)},${Y(score(day,h)).toFixed(1)}`);}
  const path='M'+pts.join(' L');
  let g=`<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D14F7B" stop-opacity=".32"/><stop offset="1" stop-color="#D14F7B" stop-opacity="0"/></linearGradient></defs>`;
  BEST[day].forEach(r=>{
    g+=`<rect x="${X(r[0])}" y="0" width="${X(r[1])-X(r[0])}" height="${BOT}" rx="7" fill="#FDEEF3"/>`;
    g+=`<text x="${(X(r[0])+X(r[1]))/2}" y="10" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".6" fill="#D14F7B" font-family="Manrope" opacity=".85">${GOLD.includes(day)&&r[0]===18?'PICO':'MELHOR'}</text>`;
  });
  g+=`<path d="${path} L${W},${BOT} L0,${BOT} Z" fill="url(#gr)"/>`;
  g+=`<path d="${path}" fill="none" stroke="#D14F7B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=`<line x1="0" y1="${BOT}" x2="${W}" y2="${BOT}" stroke="#F4E2E9"/>`;
  const cx=X(hf), cy=Y(score(day,hf));
  const lbl=live?`agora · ${hm(hf)}`:bestMode?`melhor · ${hm(hf)}`:hm(hf);
  const bw=lbl.length*6.3+16, bh=19;
  const bx=Math.min(W-bw/2,Math.max(bw/2,cx)), by=Math.max(0,cy-bh-12);
  const fill=(live||bestMode)?'#D14F7B':'#2C2127';
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${BOT}" stroke="#2C2127" stroke-dasharray="3 3"/>`;
  if(bestMode) g+=`<circle cx="${cx}" cy="${cy}" r="14" fill="none" stroke="#D14F7B" stroke-width="1.5" opacity=".5"><animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2s" repeatCount="indefinite"/></circle>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="11" fill="#D14F7B" opacity=".16"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="5.5" fill="#fff" stroke="${fill}" stroke-width="2.2"/>`;
  g+=`<rect x="${bx-bw/2}" y="${by}" width="${bw}" height="${bh}" rx="9.5" fill="${fill}"/>`;
  g+=`<text x="${bx}" y="${by+13}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" font-family="Manrope">${lbl}</text>`;
  g+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  document.getElementById('svg').innerHTML=g;

  const t=tier(day,hf), s=score(day,hf);
  const v=document.getElementById('verb');
  v.textContent=t>=2?'Solta.':'Segura.';
  v.className='verb '+(t>=2?'go':'hold');
  const L=document.getElementById('lvl'); L.className='lvl l'+(bestMode?3:t); L.textContent=bestMode?'IDEAL':LAB[t];
  document.getElementById('pct').textContent=s;
  const w=document.getElementById('when');
  w.classList.toggle('scrub',!live);
  document.getElementById('whenT').textContent=live?`${DN[day]} · ${hm(hf)}`:`${DN[day]} · ${hm(hf)}`;
  document.getElementById('back').classList.toggle('on',!live);
  document.getElementById('best').classList.toggle('on',bestMode);

  let msg;
  const preGold=GOLD.includes(day)&&hf>=17&&hf<18;
  if(live){
    const g2=nextGold(n);
    if(t===3) msg=`Pico agora. Vai até as <b>21h</b>, solta o conteúdo mais forte.`;
    else if(preGold) msg=`Hora perfeita: o pico começa às <b>18h</b>. Postando agora, o vídeo chega quente na hora cheia.`;
    else if(g2) msg=`Próximo pico: <b>${g2.k===0?'hoje':g2.k===1?'amanhã':DN[g2.d].toLowerCase()}, 18h</b> · faltam <b>${dur(g2.mins)}</b>`;
  }else if(bestMode){
    const b=nextBest();
    msg=`Melhor horário: <b>${b.k===0?'hoje':b.k===1?'amanhã':DN[b.d].toLowerCase()}, 17h30</b>. O pico começa às 18h e o vídeo chega quente na hora cheia. Faltam <b>${dur(b.mins)}</b>.`;
  }else{
    if(preGold) msg=`<b>${hm(hf)}</b>: perfeito, meia hora antes do pico.`;
    else if(t===3) msg=`<b>${hm(hf)}</b>: pico do teu público. Conteúdo mais forte da semana aqui.`;
    else if(t===2) msg=`<b>${hm(hf)}</b>: rende bem. ${GOLD.includes(day)?'Mas a noite desse dia é ouro, se der empurra pra 17h30.':'Melhor desse dia: '+BEST[day].map(range).join(' e ')+'.'}`;
    else if(t===1) msg=`<b>${hm(hf)}</b>: pouca gente online. Melhor desse dia: <b>${BEST[day].map(range).join(' e ')}</b>.`;
    else msg=`<b>${hm(hf)}</b>: público dormindo. Programa pra mais tarde.`;
  }
  document.getElementById('pill').innerHTML=msg;
}

function renderDays(){
  const n=now(), host=document.getElementById('days'); host.innerHTML='';
  ORDER.forEach(d=>{
    const b=document.createElement('button');
    b.textContent=DA[d];
    b.className=(d===day?'on ':'')+(d===n.d?'today':'');
    b.onclick=()=>{day=d; bestMode=false; sel=(d===now().d)?null:18.5; renderDays(); draw();};
    host.appendChild(b);
  });
}

/* arrasto no grafico */
const svg=document.getElementById('svg');
let drag=false;
function pick(e){
  const r=svg.getBoundingClientRect();
  let h=(e.clientX-r.left)/r.width*24;
  h=Math.min(23+59/60,Math.max(0,Math.round(h*60)/60));
  bestMode=false; sel=h; draw();
}
svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}pick(e);});
svg.addEventListener('pointermove',e=>{if(drag)pick(e);});
['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{drag=false;}));
document.getElementById('back').onclick=()=>{day=now().d;sel=null;bestMode=false;renderDays();draw();};

/* proximo melhor horario: 17h30 do proximo dia de ouro (meia hora antes do pico) */
function nextBest(){
  const n=now(), t0=n.h*60+n.m;
  for(let k=0;k<8;k++){
    const d=(n.d+k)%7; if(!GOLD.includes(d)) continue;
    const at=k*1440+17*60+30;
    if(k===0&&t0>=17*60+30&&t0<21*60) return {d,k,mins:0,now:true};
    if(at>t0) return {d,k,mins:at-t0};
  }
}
document.getElementById('best').onclick=()=>{
  const b=nextBest();
  day=b.d;
  if(b.now){sel=null;bestMode=false;}else{sel=17.5;bestMode=true;}
  renderDays();draw();
};

document.querySelectorAll('.top').forEach(b=>b.onclick=()=>{day=+b.dataset.d;sel=17.5;bestMode=false;renderDays();draw();});
renderDays(); draw();
setInterval(()=>{ if(sel===null) draw(); },30000);
</script>
</body>
</html>
